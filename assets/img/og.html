<!DOCTYPE html>
<!-- Šablonas og.png generavimui (1200x630). Nekeičia svetainės veikimo. -->
<html lang="lt">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px;
    display: flex; flex-direction: column; justify-content: center;
    padding: 76px;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #eef2ff;
    background:
      radial-gradient(50% 60% at 18% 24%, rgba(53,224,208,.20), transparent 65%),
      radial-gradient(46% 56% at 82% 20%, rgba(99,102,241,.30), transparent 68%),
      radial-gradient(40% 50% at 60% 95%, rgba(168,85,247,.18), transparent 70%),
      #070b14;
  }
  .logo { display: flex; align-items: center; gap: 14px; margin-bottom: 44px; }
  .mark {
    width: 62px; height: 62px; border-radius: 18px;
    display: grid; place-items: center;
    background: linear-gradient(100deg, #35e0d0, #6366f1 55%, #a855f7);
    color: #05101c; font-weight: 800; font-size: 24px;
  }
  .name { font-size: 32px; font-weight: 750; letter-spacing: -.03em; }
  h1 { font-size: 66px; line-height: 1.08; letter-spacing: -.035em; max-width: 17ch; }
  .grad {
    background: linear-gradient(100deg, #35e0d0, #6366f1 55%, #a855f7);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .row { display: flex; gap: 14px; margin-top: 46px; }
  .chip {
    padding: 12px 22px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.05);
    font-size: 22px; color: #9aa8c7;
  }
  .chip b { color: #eef2ff; font-weight: 650; }
</style>
</head>
<body>
  <div class="logo"><span class="mark">33</span><span class="name">bots</span></div>
  <h1>AI darbuotojas, kuris atsako klientams per <span class="grad">3 sekundes</span></h1>
  <div class="row">
    <span class="chip">Nuo <b>2 100 €</b> be PVM</span>
    <span class="chip">Paleidimas per <b>14 dienų</b></span>
    <span class="chip">Veikia <b>24/7</b></span>
  </div>
</body>
</html>
